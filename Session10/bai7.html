    <main>

                <img src="./Overlay+Shadow (6).png" alt="">

        <div class="book-today">
            <form action="#" method="post">
                <h2>Đặt Bàn Ngay Hôm Nay </h2>
                <p>Chúng tôi sẽ liên hệ xác nhận trong vòng 1 giờ.</p>

                <div class="form">
                    <input type="text" name="name" id="name" placeholder="Họ và tên" required>
                    <input type="tel" name="phoneNumber" id="phoneNumber" placeholder="Số điện thoại" required>
                    <input type="email" name="email" id="email" placeholder="Email" required>
                    <input type="date" name="date" id="date" required>
                    <input type="time" name="time" id="time">
                    <input type="number" name="guests" id="guests" placeholder="Số lượng khách">
                    <div class="button-container">
                        <button type="submit">Gửi Yêu Cầu Đặt Bàn</button>
                    </div>
                </div>
            </form>
        </div>
