<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Hieu's page</title>
    <link rel="stylesheet" href="./bai5.css">
</head>

<body>
    <header>
        <h1>Ý KIẾN PHẢN HỒI TỚI NHA SỸ</h1>
    </header>

    <main>
        <form action="#" method="post">
            <div class="Username">
                <label for="username">Họ và tên:</label> <br>
                <input type="text" id="username" name="Username" placeholder="Nhập họ và tên">
            </div>

            <div class="Email">
                <label for="email">Email:</label> <br>
                <input type="email" id="email" name="Email" placeholder="Nhập email của bạn">
                <br>
            </div>

            <div class="Feedback">
                <label for="feedback">Phản hồi của bạn:</label> <br>
                <textarea name="Feedback" id="feedback" placeholder="Nhập ý kiến của bạn...."></textarea>
                <br>
            </div>

            <div class="button">
                <input type="submit" value="Gửi ý kiến">
            </div>
        </form>
    </main>
</body>

</html>
