<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Hieu's page</title>
    <link rel="stylesheet" href="./bai.css">
</head>
<body>
    <form action="#" method="post">
        <fieldset>
            <legend>Đăng ký</legend>
            <p>Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>
            <div class="name-list">
                <div class="middle-name">
                    <label for="middle-name">Họ và tên đệm</label>
                    <input type="text" id="middle-name name="middle-name" placeholder="Nguyễn Văn" required>
                </div>
                <div class="full-name">
                    <label for="full-name">Tên đầy đủ</label>
                    <input type="text" id="full-name" name="full-name" placeholder="An" required>
                </div>
            </div>

            <div class="other-information">
                <label for="tel-number">Số điện thoại</label>
                <input type="tel" id="tel-number" name="tel-number" placeholder="0123456789" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Nhập địa chỉ email" required>

                <label for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required>

                <label for="re-password">Nhập lại mật khẩu</label>
                <input type="password" id="re-password" name="re-password" placeholder="Nhập lại mật khẩu" required>
            </div>

            <div class="button-container">
                <button type="submit">Đăng ký</button>
            </div>

            <div class="log-in">
                <p>Đã có tài khoản?</p>
                <a href="#">Đăng nhập</a>
            </div>
        </fieldset>
    </form>
</body>
</html>
