<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Hieu's page</title>
    <link rel="stylesheet" href="./bai3.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="main-container">
        <form class="registration-form">
            <header class="form-header">
                <h1>Đăng ký</h1>
                <p>Tạo tài khoản để bắt đầu học tập trên hệ thống e-learning</p>
            </header>

            <div class="form-content">
                <div class="input-row">
                    <div class="input-group">
                        <label>Họ và tên đệm</label>
                        <input type="text" placeholder="Nguyễn Văn">
                    </div>
                    <div class="input-group">
                        <label>Tên đầy đủ</label>
                        <input type="text" placeholder="An">
                    </div>
                </div>

                <div class="input-group">
                    <label>Số điện thoại</label>
                    <input type="tel" placeholder="0912 345 678">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="Nhập địa chỉ email">
                </div>

                <div class="input-group">
                    <label>Mật khẩu</label>
                    <input type="password" placeholder="Nhập mật khẩu">
                </div>

                <div class="input-group">
                    <label>Nhập lại mật khẩu</label>
                    <input type="password" placeholder="Nhập lại mật khẩu">
                </div>
            </div>

            <button type="submit" class="btn-submit">Đăng ký</button>

            <footer class="form-footer">
                Đã có tài khoản? <a href="#">Đăng nhập</a>
            </footer>
        </form>
    </div>

</body>

</html>
