<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Hieu's page</title>
    <link rel="stylesheet" href="./bai5.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="container header-flex">
            <div class="logo">
                <img src="https://via.placeholder.com/120x40?text=RKEIEdu" alt="Logo">
            </div>
            <nav class="nav-menu">
                <a href="#">Trang chủ</a>
                <a href="#">Khóa học</a>
                <a href="#" class="active">Khóa học của tôi</a>
                <a href="#">Liên hệ</a>
            </nav>
            <div class="user-info">
                <img src="https://via.placeholder.com/35" alt="Avatar">
                <span>Nguyễn Văn A</span>
            </div>
        </div>
    </header>

    <section class="banner">
        <div class="container">
            <h1>Khóa Học Của Tôi</h1>
            <p>Tiếp tục hành trình học tập và phát triển kỹ năng của bạn</p>
        </div>
    </section>

    <main class="login-section">
        <form class="login-form">
            <header class="form-header">
                <h2>Đăng nhập</h2>
                <p>Đăng nhập để sử dụng hệ thống e-learning</p>
            </header>

            <div class="input-group">
                <label>Email</label>
                <input type="email" placeholder="Nhập địa chỉ email">
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <input type="password" placeholder="Nhập mật khẩu">
            </div>

            <div class="form-actions">
                <label class="checkbox-container">
                    <input type="checkbox"> Ghi nhớ đăng nhập
                </label>
                <a href="#" class="link-blue">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-primary">Đăng nhập</button>

            <div class="form-footer">
                Chưa có tài khoản? <a href="#" class="link-blue">Đăng ký ngay</a>
            </div>
        </form>
    </main>

</body>
</html>
