<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This is Hieu's page</title>
</head>

<body>

    <form action="#" method="post">

        <div>
            <label for="full_name">Họ và tên:</label>
            <input type="text" id="full_name" name="full_name" required>
            <br><br>
        </div>

        <div>
            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob" required>
            <br><br>
        </div>

        <div>
            <label>Giới tính:</label>
            <label><input type="radio" name="gender" value="Nam"> Nam</label>
            <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
            <br><br>
        </div>

        <div>
            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone" placeholder="0123456789">
            <br><br>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>
        </div>

        <div>
            <label for="address">Địa chỉ:</label><br>
            <textarea id="address" name="address" rows="3" cols="30"></textarea>
            <br><br>
        </div>

        <div>
            <label for="role">Vai trò trong CLB:</label>
            <select id="role" name="role">
                <option value="ThanhVien">Thành viên</option>
                <option value="TruongNhom">Trưởng nhóm</option>
                <option value="PhoNhom">Phó nhóm</option>
            </select>
            <br><br>
        </div>

        <div>
            <label for="hobby">Sở thích:</label>
            <input type="text" id="hobby" name="hobby">
            <br><br>
        </div>

        <div>
            <label for="skills">Kỹ năng:</label><br>
            <textarea id="skills" name="skills" rows="3" cols="30"></textarea>
            <br><br>
        </div>

        <div>
            <label>Thời gian rảnh:</label>
            <label><input type="checkbox" name="free_time" value="Sang"> Sáng</label>
            <label><input type="checkbox" name="free_time" value="Chieu"> Chiều</label>
            <label><input type="checkbox" name="free_time" value="Toi"> Tối</label>
            <br><br>
        </div>

        <div>
            <label for="reason">Lý do tham gia CLB:</label><br>
            <textarea id="reason" name="reason" rows="3" cols="30"></textarea>
            <br><br>
        </div>

        <div>
            <label for="color">Màu yêu thích:</label>
            <input type="color" id="color" name="color">
            <br><br>
        </div>

        <div>
            <label>
                <input type="checkbox" name="newsletter"> Đăng ký nhận bản tin
            </label>
            <br><br>
        </div>

        <div>
            <label>Nhận thông báo qua:</label>
            <label><input type="radio" name="notify" value="Email"> Email</label>
            <label><input type="radio" name="notify" value="SMS"> SMS</label>
            <br><br>
        </div>

        <div>
            <input type="submit" value="Đăng ký thành viên">
        </div>

    </form>

</body>

</html>
