<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>This is Hieu's page</title>
</head>

<body>
    <form action="#" method="post">

        <div>
            <label for="full_name">Họ và tên:</label>
            <input type="text" id="full_name" name="full_name">
            <br><br>
        </div>

        <div>
            <label for="dob">Ngày sinh:</label>
            <input type="date" id="dob" name="dob">
            <br><br>
        </div>

        <div>
            <label>Giới tính:</label>
            <label><input type="radio" name="gender" value="Nam"> Nam</label>
            <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
            <br><br>
        </div>

        <div>
            <label for="phone">Số điện thoại:</label>
            <input type="tel" id="phone" name="phone">
            <br><br>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br><br>
        </div>

        <div>
            <label for="company_name">Tên công ty:</label>
            <input type="text" id="company_name" name="company_name">
            <br><br>
        </div>

        <div>
            <label for="company_role">Vai trò trong công ty:</label>
            <select id="company_role" name="company_role">
                <option value="CEO">Giám đốc điều hành (CEO)</option>
                <option value="Manager">Quản lý</option>
                <option value="Staff">Nhân viên</option>
            </select>
            <br><br>
        </div>

        <div>
            <label for="company_size">Quy mô công ty:</label>
            <select id="company_size" name="company_size">
                <option value="Small">Doanh nghiệp nhỏ</option>
                <option value="Medium">Doanh nghiệp vừa</option>
                <option value="Large">Doanh nghiệp lớn</option>
            </select>
            <br><br>
        </div>

        <div>
            <label for="industry">Ngành nghề công ty:</label>
            <input type="text" id="industry" name="industry">
            <br><br>
        </div>

        <div>
            <label for="reason">Lý do tham gia câu lạc bộ:</label><br>
            <textarea id="reason" name="reason" rows="3" cols="35"></textarea>
            <br><br>
        </div>

        <div>
            <label for="experience">Kinh nghiệm lãnh đạo:</label><br>
            <textarea id="experience" name="experience" rows="3" cols="35"></textarea>
            <br><br>
        </div>

        <div>
            <label for="goal">Mục tiêu khi tham gia câu lạc bộ:</label><br>
            <textarea id="goal" name="goal" rows="3" cols="35"></textarea>
            <br><br>
        </div>

        <div>
            <label>Chương trình sự kiện mong muốn tham gia:</label><br>
            <label><input type="checkbox" name="event" value="Networking"> Networking</label>
            <label><input type="checkbox" name="event" value="Workshops"> Workshops</label>
            <label><input type="checkbox" name="event" value="Conference"> Hội thảo</label>
            <br><br>
        </div>

        <div>
            <label>
                <input type="checkbox" name="newsletter"> Đăng ký nhận bản tin
            </label>
            <br><br>
        </div>

        <div>
            <input type="submit" value="Đăng ký hội viên">
        </div>

    </form>

</body>

</html>
